{{- /* API keys per tenant and an admin key. Generated once, kept on upgrade via lookup. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "ai-gateway-keys") | default dict }}
{{- $data := $existing.data | default dict }}
{{- $keys := list }}
{{- range .Values.gateway.tenants }}
{{- $keys = append $keys (printf "%s=sk-%s-%s" . . (randAlphaNum 32)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-keys
  labels: {{- include "aigw.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-keys: {{ get $data "api-keys" | default (join "\n" $keys | b64enc) }}
  admin-key: {{ get $data "admin-key" | default (randAlphaNum 40 | b64enc) }}
