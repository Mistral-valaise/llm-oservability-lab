name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.18.4
  HELMFILE_VERSION: 1.1.3
  HELM_DIFF_VERSION: v3.12.0
  KUBECONFORM_VERSION: v0.7.0
  IMAGE: ghcr.io/mistral-valaise/llm-observability-lab/ai-gateway

jobs:
  app:
    name: app - lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-gateway/requirements.txt
      - run: pip install -r requirements.txt && pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  manifests:
    name: charts - lint, render, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install helmfile and kubeconform
        run: |
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin helmfile
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Dashboard JSON is generated from source
        run: python3 scripts/gen_dashboard.py && git diff --exit-code charts/lab-platform/dashboards
      - name: helm lint
        run: |
          helm lint --strict charts/ai-gateway charts/lab-platform
          helm lint --strict charts/ai-gateway --set openshift=true
          helm lint --strict charts/lab-platform --set expose.mode=route
      - name: Render every environment
        run: |
          helmfile repos
          make template ENV=k3d
          NAMESPACE=demo-dev make template ENV=sandbox
          make template ENV=k3d DISABLE="loki tempo"
      - name: Validate against Kubernetes schemas
        run: kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.33.0 out/
      - name: Validate Prometheus rules with promtool
        run: |
          python3 -m pip install --quiet pyyaml
          mkdir -p out/rules
          python3 -c "import yaml; d=yaml.safe_load(open('deploy/values/prometheus-rules.yaml'))['serverFiles']; [open(f'out/rules/{k}','w').write(yaml.safe_dump(v)) for k,v in d.items()]"
          docker run --rm -v "$PWD/out/rules:/rules:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /rules/recording_rules.yml /rules/alerting_rules.yml
      - name: Policy checks on rendered manifests
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_manifests.py out/k3d out/sandbox

  image:
    name: image - build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/ai-gateway
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fail on fixable critical)
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE }}:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

  e2e:
    name: e2e - k3d deploy and smoke test
    runs-on: ubuntu-latest
    needs: [app, manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install helmfile, helm-diff, k3d
        run: |
          curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin helmfile
          helm plugin install https://github.com/databus23/helm-diff --version "${HELM_DIFF_VERSION}"
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: make up
        run: make up ENV=k3d
      - name: make smoke
        run: make smoke ENV=k3d
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n llm-lab get pods,svc,netpol,pvc -o wide || true
          kubectl -n llm-lab get events --sort-by=.lastTimestamp | tail -50 || true
          for d in ai-gateway otel-collector; do kubectl -n llm-lab logs deploy/$d --tail=80 || true; done
