[project]
name = "ai-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with OpenTelemetry GenAI instrumentation, guardrails and cost tracking"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.6"]

[project.scripts]
loadgen = "gateway.loadgen:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S311"]  # random is fine for simulation, not for crypto

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
